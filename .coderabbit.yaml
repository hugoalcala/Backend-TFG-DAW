# CodeRabbit Configuration
# Configuración para revisión automática de código en PRs hacia dev

language: es

# Configuración de revisiones
reviews:
  # Perfil de revisión
  profile: chill
  
  # Solicitar cambios si se encuentran problemas críticos
  request_changes_workflow: false
  
  # Nivel de revisión alto para mejor análisis
  high_level_summary: true
  
  # Generar poema sobre el PR (opcional, para hacerlo divertido)
  poem: false
  
  # Generar resumen de revisión
  review_status: true
  
  # Colapsar el walkthrough para no saturar
  collapse_walkthrough: false
  
  # Filtros de rutas - Excluir archivos que no necesitan revisión
  path_filters:
    - "!**/*.lock"
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/storage/**"
    - "!**/bootstrap/cache/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!package-lock.json"
    - "!composer.lock"
  
  # Instrucciones personalizadas para el revisor
  path_instructions:
    - path: "app/Http/Controllers/**"
      instructions: |
        Revisar cuidadosamente:
        - Validación de entrada de datos
        - Autorización y permisos
        - Manejo de errores y excepciones
        - Respuestas JSON consistentes
        - Seguridad contra SQL injection y XSS
    
    - path: "database/migrations/**"
      instructions: |
        Verificar que:
        - Incluya método down() para rollback
        - Los nombres de columnas sigan convenciones Laravel
        - Se definan índices apropiados
        - Las foreign keys estén correctamente configuradas
    
    - path: "routes/**"
      instructions: |
        Revisar:
        - Middleware de autenticación y autorización
        - Nombres de rutas consistentes
        - Agrupación apropiada de rutas
        - Rate limiting si es necesario
    
    - path: "app/Models/**"
      instructions: |
        Verificar:
        - Relaciones de Eloquent correctamente definidas
        - $fillable o $guarded configurado
        - Casting de atributos
        - Accessors y mutators si son necesarios

# Configuración de chat
chat:
  auto_reply: true
